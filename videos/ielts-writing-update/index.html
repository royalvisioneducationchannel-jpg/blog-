<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"hookChip","type":"string","label":"Hook chip","default":"IELTS Update"},{"id":"ctaKicker","type":"string","label":"CTA kicker","default":"Mazeed Guidance ke liye"},{"id":"ctaTitle","type":"string","label":"CTA title","default":"Aaj hi Rabta Karein"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0e1530;
        --ink: #ffffff;
        --accent: #ffc93c;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 540px 640px;
      }
      #speaker {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      #broll {
        z-index: 2;
      }
      #titles {
        z-index: 3;
      }
      #captions {
        z-index: 4;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="51.15"
      data-width="1080"
      data-height="1920"
    >
      <div id="cam">
        <video
          id="speaker"
          class="clip"
          src="assets/media/speaker.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="51.15"
          data-track-index="0"
        ></video>
      </div>

      <div
        id="broll"
        class="scene"
        data-composition-id="broll"
        data-composition-src="compositions/broll.html"
        data-start="9.9"
        data-duration="36.3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="titles"
        class="scene"
        data-composition-id="titles"
        data-composition-src="compositions/titles.html"
        data-start="0"
        data-duration="51.15"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="51.15"
        data-track-index="3"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
      ></div>

      <audio id="voice" class="clip" src="assets/audio/voice.wav" data-start="0" data-duration="51.15" data-track-index="4" data-volume="1"></audio>
      <audio
        id="music"
        class="clip"
        src="assets/audio/music-motivating-mornings.mp3"
        data-start="0"
        data-duration="51.15"
        data-track-index="5"
        data-volume="0.14"
        data-fade-in="0.6"
        data-fade-out="0.9"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.5},{"t":50.3,"v":0.5},{"t":50.7,"v":1}]}]}'
      ></audio>
      <audio id="sfx-1" class="clip" src="assets/audio/whoosh-short.mp3" data-start="9.78" data-duration="0.57" data-track-index="6" data-volume="0.22"></audio>
      <audio id="sfx-2" class="clip" src="assets/audio/whoosh-short.mp3" data-start="21.73" data-duration="0.57" data-track-index="6" data-volume="0.22"></audio>
      <audio id="sfx-3" class="clip" src="assets/audio/whoosh-short.mp3" data-start="26.98" data-duration="0.57" data-track-index="7" data-volume="0.22"></audio>
      <audio id="sfx-4" class="clip" src="assets/audio/whoosh-short.mp3" data-start="37.38" data-duration="0.57" data-track-index="7" data-volume="0.22"></audio>
      <audio id="sfx-5" class="clip" src="assets/audio/whoosh-short.mp3" data-start="40.08" data-duration="0.57" data-track-index="8" data-volume="0.22"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Punch-ins on emphasis; reset happens under B-roll so the cut hides it
      tl.set("#cam", { scale: 1 }, 0);
      tl.to("#cam", { scale: 1.12, duration: 0.35, ease: "power2.out" }, 14.95);
      tl.set("#cam", { scale: 1 }, 21.9);
      tl.to("#cam", { scale: 1.1, duration: 0.35, ease: "power2.out" }, 33.75);
      tl.set("#cam", { scale: 1 }, 37.55);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
